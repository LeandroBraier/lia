services:
  lia-vault:
    build: .
    container_name: lia_vault_app
    ports:
      - "8502:8502"
    volumes:
      - ./entrada:/app/entrada
      - ./salida:/app/Archivos seguros de Checkpoint Ley IA
      - ./procesados:/app/procesados
      - ./diccionario_corporativo.txt:/app/diccionario_corporativo.txt
      - ./licencia.key:/app/licencia.key
      - ./Llaves:/app/Llaves
    environment:
      - LIA_VAULT_FRASE_MAESTRA
    restart: unless-stopped
